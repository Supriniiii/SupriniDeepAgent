[project]
name = "code_review_agent"
version = "0.1.0"
description = "An AI agent that reviews code for quality, best practices, security vulnerabilities, and maintainability issues. Analyzes pull requests and produces structured review feedback."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]
