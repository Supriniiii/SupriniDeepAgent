[project]
name = "no_code_frontend_agent"
version = "0.1.0"
description = "An AI agent that generates front-end UI components, layouts, and pages from natural language descriptions without requiring manual coding. Uses LangChain and Azure OpenAI to interpret design requests and produce HTML/CSS/JavaScript."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/no_code_frontend_agent"]
