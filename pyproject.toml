[project]
name = "daep"
version = "0.1.0"
description = "Deep Agent Engineering Platform - Enterprise AI agent generation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AI Engineering Team"}
]
keywords = ["ai", "agents", "deep-agents", "engineering", "kiro"]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
data = [
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "plotly>=5.0",
]

[project.scripts]
daep = "daep.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daep"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
